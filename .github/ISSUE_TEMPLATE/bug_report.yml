name: Bug report
description: Something on your hotel did not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy a Hermes agent from the template
        2. Open its Chat
        3. ...
  - type: input
    id: version
    attributes:
      label: Panel version
      description: Shown at the bottom of the sidebar.
      placeholder: e.g. bc91b2d
  - type: input
    id: host
    attributes:
      label: Host
      description: The OS and size of the server, and whether the hotel runs behind a Cloudflare Tunnel or NetBird.
      placeholder: Ubuntu 24.04, 4 vCPU / 8 GB, Cloudflare Tunnel
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The deploy log from the agent's Deployments tab, or `docker compose logs backend`. Remove keys, tokens and passwords before you paste.
      render: text
