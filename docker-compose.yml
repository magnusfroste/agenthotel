services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentpanel-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - DB_PATH=/data/agentpanel.db
      - CADDY_API_URL=http://caddy:2019
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - GIT_VERSION=${GIT_VERSION:-unknown}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agentpanel-data:/data
      - ./templates:/templates
    depends_on:
      - caddy
    networks:
      - agentpanel

  caddy:
    image: caddy:2
    container_name: agentpanel-caddy
    restart: unless-stopped
    command: caddy run --config /etc/caddy/caddy.json
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy.json:/etc/caddy/caddy.json:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - agentpanel

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentpanel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - agentpanel

volumes:
  agentpanel-data:
  caddy-data:
  caddy-config:

networks:
  agentpanel:
    driver: bridge
