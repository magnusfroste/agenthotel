services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Baked into the image, not passed at runtime: the reported version must
      # describe the code in the image and change only when it is rebuilt.
      # `docker compose build --build-arg GIT_COMMIT=...` overrides these.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_VERSION: ${GIT_VERSION:-unknown}
    container_name: agenthotel-backend
    restart: unless-stopped
    # pid: host + privileged let the backend nsenter into PID 1's namespaces
    # so the Server Console runs commands on the VPS host. privileged is needed
    # because AppArmor/seccomp otherwise block the namespace switch. This adds
    # no real privilege: the mounted /var/run/docker.sock already grants
    # host-root equivalence.
    pid: host
    privileged: true
    # Panel resource guardrails: high cpu-shares mean the panel always wins
    # CPU contention against agents (which run at 256 shares — shares only
    # matter when the CPU is saturated, idle capacity is still shared), and
    # the negative oom_score_adj makes the kernel OOM-kill agents before
    # ever touching the panel.
    cpu_shares: 2048
    oom_score_adj: -500
    environment:
      - PORT=8080
      - DB_PATH=/data/agenthotel.db
      - CADDY_API_URL=http://caddy:2019
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agenthotel-data:/data
      - ./templates:/templates
      # Checkouts for compose guests, mounted at the SAME path inside and out.
      #
      # A compose file that bind-mounts its own files — SkillHub mounts a dozen
      # SQL and config files — is resolved by the Docker daemon on the host, not
      # inside this container. A checkout living only in the /data volume is
      # invisible there, and Docker silently creates an empty directory where
      # the file should be: Postgres then met a directory named roles.sql,
      # stopped its init half way, and every service failed to authenticate
      # against a database whose passwords had never been set.
      #
      # Identical paths on both sides make every relative mount resolve the
      # same way for whoever reads it.
      - /var/lib/agenthotel/checkouts:/var/lib/agenthotel/checkouts
    depends_on:
      - caddy
    networks:
      - agenthotel

  caddy:
    image: caddy:2
    container_name: agenthotel-caddy
    restart: unless-stopped
    cpu_shares: 2048
    oom_score_adj: -500
    command: caddy run --config /etc/caddy/caddy.json
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy.json:/etc/caddy/caddy.json:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - agenthotel

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agenthotel-frontend
    restart: unless-stopped
    cpu_shares: 2048
    oom_score_adj: -500
    depends_on:
      - backend
    networks:
      - agenthotel

volumes:
  agenthotel-data:
  caddy-data:
  caddy-config:

networks:
  agenthotel:
    driver: bridge
