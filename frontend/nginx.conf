server {
    listen 80;
    root /usr/share/nginx/html;

    # Asset filenames carry a content hash, so they may be cached forever —
    # a new build produces new names rather than new contents.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # index.html must not be cached: it is the only file that names the
        # current bundle. Served without this header a browser cached it
        # heuristically and kept running the previous build after an upgrade,
        # which reads as "the new feature did not ship".
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
