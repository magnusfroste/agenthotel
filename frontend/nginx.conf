server {
    listen 80;
    root /usr/share/nginx/html;

    # Asset filenames carry a content hash, so they may be cached forever —
    # a new build produces new names rather than new contents.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # index.html must not be cached: it is the only file that names the
        # current bundle. Served without this header a browser cached it
        # heuristically and kept running the previous build after an upgrade,
        # which reads as "the new feature did not ship".
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # No /api here. Caddy sends /api/* straight to the backend; this proxy was
    # a second way in, open to every guest on the network that could reach
    # frontend:80, and nothing used it.
}
