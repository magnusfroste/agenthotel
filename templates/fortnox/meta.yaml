name: Fortnox
category: MCP Tool
icon: receipt
color: '#0f766e'
source: builtin
description: "Fortnox for your agents, for one company or several. agentmcp-fortnox signs in to your own integration in Fortnox once per company, keeps the books synced, and lets an agent read them and write: vouchers, supplier and customer invoices, payments, customers, files. Every agent key reaches exactly one company, and every write is logged with the agent that made it."
agentUse: |
  Over MCP at https://<domain>/mcp, one key per agent (Credentials). The key decides which company the agent reaches; no tool takes a company, so an agent that works for two companies has two server entries, one per key. The agent reads vouchers, accounts, income statement, balance sheet and invoices, and writes vouchers, invoices, payments, registers and files to Fortnox; the tool skrivlogg shows every write with the agent's key name.
instructions: |
  Give it a domain first: Fortnox sends the sign-in back to https://<domain>/oauth/callback.

  In Fortnox' Developer Portal, create an integration: redirect URI `https://<domain>/oauth/callback` exactly (no trailing slash), the scopes you want the agents to reach, and "allow authorization as service account" ticked. Enter its client id and secret here. One integration is enough for any number of companies. Give it a neutral name: Fortnox shows that name to everyone who approves. Each company needs the Fortnox modules the scopes cover and, as Fortnox prices it, an integration licence (a Fortnox test company needs none).

  One company. After the deploy, a system administrator of the company opens `https://<domain>/oauth/start/<OAUTH_START_TOKEN>` (the token is under Credentials) and approves, in that same browser and within ten minutes. The first sync starts at once and then runs every 6 hours and after writes. The guest stays tied to that company.

  Several companies, with the same integration and the same redirect URI:
  1. Give each agent key a company as a third part in MCP_KEYS under Environment, e.g. `peter:<key>:optic,fredrik:<key>:resta` (a company is a-z, 0-9 and -), and redeploy. A key reaches that company and no other. A key without a company part reaches the single company above.
  2. Open `https://<domain>/health/<OAUTH_START_TOKEN>`. It lists every company: signed in or waiting, its name once signed in, and its `sign_in_link`.
  3. Send each link to a system administrator of that company. They open it, pick the company in Fortnox, approve, and land on a page that names the company that was connected. A link works for its own company only, and the approval must come from the browser that opened it, within ten minutes. Keep OAUTH_START_TOKEN to yourself: it opens every company's sign-in and the overview.
  4. Each company gets its own folder, tokens, sync and write log (/data/companies/<company>) and stays tied to the Fortnox company that first signed in there. Try a test company in a place of its own first, never in a real company's place.

  Agents use `https://<domain>/mcp` with their key as `Authorization: Bearer <key>`. One key per agent and company: append `,name:key` or `,name:key:company` to MCP_KEYS under Environment (a key is 32+ characters, e.g. `openssl rand -hex 32`) and redeploy. FORTNOX_READ_ONLY=true lets only reads reach Fortnox.

  The data volume holds a copy of each company's books, the PDFs and the refresh tokens: it is as sensitive as a Fortnox login, and the hotel's backups include it.
tags:
- mcp
- fortnox
- bookkeeping
- invoices
- hermes
links:
- label: Repository
  url: https://github.com/magnusfroste/agentmcp-fortnox
benefits:
- title: Signs in once
  description: A system administrator approves your own integration; the guest refreshes the tokens itself, as a service account that outlives any employee
- title: Reads and writes
  description: Books and documents synced for fast answers, and vouchers, invoices, payments and files written straight to Fortnox
- title: Who did what
  description: Every write in the log with the name of the agent key that made it
- title: One guest, several companies
  description: One integration and one redirect URI; each company signs in separately and each agent key reaches exactly one of them
features:
- title: Financial statements
  description: Income statement by BAS group and balance sheet with a check that comes out at 0, computed in the service
- title: Twenty-one MCP tools
  description: verifikationer, resultatrakning, balansrakning, skapa_verifikation, skapa_kundfaktura, registrera_betalning, ladda_upp_fil, fortnox_api and more
- title: Files without base64
  description: An agent posts a PDF to /upload with curl and attaches it to a voucher or supplier invoice
deploy:
  runtime: git-app
  repo: https://github.com/magnusfroste/agentmcp-fortnox
  ref: main
  port: 8000
  healthcheck: /health
  envFile: |
    MCP_KEYS=${FIRST_AGENT}:${FORTNOX_AGENT_KEY}
    OAUTH_START_TOKEN=${OAUTH_START_TOKEN}
    LINK_SECRET=${LINK_SECRET}
    PUBLIC_URL=https://${DOMAIN}
    FORTNOX_REDIRECT_URI=https://${DOMAIN}/oauth/callback
    CPU_LIMIT=0.5
    MEMORY_LIMIT_MB=512
  env:
  - key: FORTNOX_CLIENT_ID
    label: Fortnox client id
    type: text
    required: true
    description: From your integration in Fortnox' Developer Portal
  - key: FORTNOX_CLIENT_SECRET
    label: Fortnox client secret
    type: password
    required: true
  - key: FIRST_AGENT
    label: First agent
    type: text
    default: hermes
    description: The name the first agent key gets; it is on every write that agent makes
  - key: FORTNOX_SYNC_FROM
    label: Sync from
    type: text
    description: Optional. First date to sync (ÅÅÅÅ-MM-DD); default January 1st last year
  - key: FORTNOX_READ_ONLY
    label: Read only
    type: text
    default: 'false'
    description: true lets only reads reach Fortnox and hides the write tools
  secrets:
  - key: FORTNOX_AGENT_KEY
    generate: hex
    bytes: 32
  - key: OAUTH_START_TOKEN
    generate: hex
    bytes: 32
  - key: LINK_SECRET
    generate: hex
    bytes: 32
