name: ZeroClaw
category: AI Agent
icon: bot
color: '#f97316'
source: builtin
description: 'Small, fast autonomous assistant written in Rust, from zeroclaw-labs. A web dashboard for chat, memory, config, scheduled jobs and tools, channels (Telegram, Matrix, WhatsApp and more), and any model provider. The container uses about 15 MB of memory at rest.

  '
agentUse: 'Another agent can hand ZeroClaw work over HTTP: POST https://<domain>/webhook with {"message": "..."} and the header Authorization: Bearer <token>, where the token comes from pairing (POST /pair with the one-time code). The REST API at https://<domain>/api is documented at /api/docs.

  '
instructions: 'Pairing is on: until you pair, the dashboard and API answer nobody. Right after the deploy, open the guest''s Logs and find "PAIRING REQUIRED — use this one-time code". Open https://<domain>, enter the code, and the dashboard keeps the token it gets back. The code works once. To get a new one later (another browser, after logging out), run zeroclaw gateway get-paircode --new in the guest''s console.


  The model: with an OpenRouter key on the form, ZeroClaw answers with the model named there. Anything else (Anthropic, OpenAI, Ollama, an OpenAI-compatible endpoint of your own) is set in the dashboard''s config editor, or with ZEROCLAW_<path with __ for dots> variables on the Environment tab, which win over the config file. For an OpenAI-compatible endpoint of your own (the custom provider), also set native_tools = true on it: without it the tools are described in the prompt, and a model such as DeepSeek answers with its own tool markup as text instead of calling them.


  The context window: ZeroClaw asks a provider how large it is only in its own setup wizard, which the hotel does not run, and never asks a custom provider. Unless the provider in the config has context_window set, it assumes 32,000 tokens and refuses a longer turn itself with "This request exceeds the selected model''s context window", however large the model really is. With every tool on, the tools alone are about 16,000 of those, so two or three web fetches fill it. For the OpenRouter model, fill in the context window on the form; for any other provider, set context_window on it in the config editor (for a custom provider: providers.models.custom.<name>.context_window). The template also trims history at 80 % of that window, and raises ZeroClaw''s own budgets of 10 tool steps a turn and 20 actions an hour, which a task such as building a small web app runs out of; all three are on the Environment tab.


  The image approves only reading tools by itself; writing a file or storing a memory waits for someone to approve it in the dashboard. For an agent that works on its own, add file_write, file_edit and memory_store to risk_profiles.default.auto_approve.


  Config, memory and pairing live in the guest''s zeroclaw volume and survive redeploys.

  '
tags:
- agent
- rust
- channels
- memory
links:
- label: GitHub
  url: https://github.com/zeroclaw-labs/zeroclaw
- label: Container guide
  url: https://github.com/zeroclaw-labs/zeroclaw/blob/master/docs/book/src/setup/container.md
deploy:
  runtime: docker-app
  # The debian variant, not :latest: :latest is distroless, with no shell,
  # so the guest's Console tab (and zeroclaw gateway get-paircode in it)
  # would not open.
  image: ghcr.io/zeroclaw-labs/zeroclaw:debian
  port: 42617
  healthcheck: /health
  volumes:
  - zeroclaw:/zeroclaw-data
  # The image's own config has pairing off, so as it ships anyone who finds
  # the domain could read its config and memory and talk to it. Here pairing
  # is on; environment variables win over the config file, so a config edited
  # in the dashboard cannot turn it off by accident.
  #
  # The three runtime limits: a ZeroClaw guest asked to build a small web app
  # (2026-11-25) stopped at 10 tool steps, at 20 actions an hour, and at a
  # context window it had guessed at 32,000 tokens. The ratio trims history
  # at 80 % of the provider's context_window instead of at a fixed 32,000.
  # Upstream: zeroclaw-labs/zeroclaw#12014.
  envFile: |
    ZEROCLAW_gateway__require_pairing=true
    ZEROCLAW_gateway__host=[::]
    ZEROCLAW_gateway__allow_public_bind=true
    ZEROCLAW_runtime_profiles__default__context_compact_ratio=0.8
    ZEROCLAW_runtime_profiles__default__max_tool_iterations=40
    ZEROCLAW_runtime_profiles__default__max_actions_per_hour=200
  # Left empty, these never become environment (an empty value would override
  # whatever is set later in the dashboard).
  env:
  - key: ZEROCLAW_providers__models__openrouter__default__api_key
    label: OpenRouter API key
    type: password
    description: Optional. Without it, set a provider in the dashboard after pairing
  - key: ZEROCLAW_providers__models__openrouter__default__model
    label: Model (OpenRouter)
    type: text
    description: Optional, e.g. anthropic/claude-sonnet-4.5. Empty keeps the image's default
  - key: ZEROCLAW_providers__models__openrouter__default__context_window
    label: Context window (OpenRouter model)
    type: number
    description: Optional, in tokens, e.g. 200000 for Claude Sonnet. Without it ZeroClaw assumes 32,000 and refuses longer turns. Look the model up on openrouter.ai/models
