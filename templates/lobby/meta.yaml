name: Lobby
category: Web
icon: globe
color: '#0ea5e9'
source: builtin
description: 'A web hotel for landing pages. One container serves many domains, and each site is a single markdown file, so an agent can write a whole page with one call and a person can edit it in the browser.

  '
agentUse: |
  A guest of the same hotel reaches it through the reception, the `hotel` MCP server it was given at check-in: no address and no token of its own. An agent anywhere else uses MCP at https://<domain>/mcp, with the API token under Credentials. Either way an agent writes a whole landing page with one write_site call; behind a wildcard (*.example.com under Extra domains) a new site needs no DNS change and gets its certificate on its first visit.
instructions: |
  A site is named after its hostname: `shop.example.com` is served from the file `shop.example.com.md`. An unknown hostname gets a 404 on purpose, so behind a wildcard a mistyped link never renders someone else's page.

  Domains, two ways:

  1. One name per site. Point each name's DNS at this server (an A record), and list the names under Extra domains, comma separated: `shop.example.com, cafe.example.com`. Each gets its own certificate. A new site needs a DNS record and an edit here.
  2. Every subdomain at once. Point `*.example.com` at this server once (one wildcard A record), and put `*.example.com` under Extra domains. From then on a new site is one write_site call: no DNS change, no redeploy. The certificate is fetched on the site's first visit, and only for a name that Lobby actually has a site for, so nobody can make the hotel request certificates for names that do not exist. A wildcard covers one level: `shop.example.com`, not `a.shop.example.com`.

  Behind Cloudflare with the orange cloud, its free certificate also covers only one level below the zone, and its Browser Integrity Check blocks some agents' HTTP clients. With DNS only (grey cloud) this server answers directly.

  The Domain field is the Lobby's own name, where /admin and /mcp live. Create the first site there: open https://<domain>/admin, log in with the admin user and the generated password under Credentials, and create a site named after the domain.

  Agents use https://<domain>/mcp with the generated API token as `Authorization: Bearer <token>`. The server describes itself: describe_format gives the page format, check_site says what is wrong with a page before it is published, and list_sites, read_site, write_site, delete_site and list_themes do the rest.
tags:
- landing pages
- markdown
- cms
- mcp
- web hosting
links:
- label: Repository
  url: https://github.com/magnusfroste/agentlobby
benefits:
- title: The file is the site
  description: Plain markdown on a volume. Edit it with any tool, keep it in git, back it up with cp
- title: Agents can publish
  description: A page is one write_site call over MCP, and it shows up in the admin at once
- title: Read by machines
  description: Server-rendered with no client JavaScript, so crawlers and language models read the whole page
features:
- title: Many domains, one container
  description: The hostname picks the file
- title: Safe concurrent edits
  description: Atomic writes with a content version, so a stale save is refused instead of silently winning
- title: Themes and blocks
  description: '::directive{attr} blocks for hero, features, FAQ and more'
place:
  mcp: /mcp
  auth: bearer
  tokenEnv: LOBBY_API_TOKEN
deploy:
  runtime: git-app
  repo: https://github.com/magnusfroste/agentlobby
  ref: main
  port: 8080
  healthcheck: /healthz
  env:
  - key: DOMAIN_ALIASES
    label: Extra domains
    type: text
    placeholder: '*.example.com  or  shop.example.com, cafe.example.com'
    description: The sites' hostnames, comma separated, or one wildcard like *.example.com for every subdomain. Point their DNS at this server first; the instructions explain both ways
  - key: LOBBY_ADMIN_USER
    label: Admin username
    type: text
    default: admin
    description: The password is generated and shown under Credentials
  - key: DEFAULT_SITE
    label: Fallback site
    type: text
    description: Optional. A site name to show for any unknown hostname. Empty keeps unknown hostnames a 404
  secrets:
  - key: LOBBY_API_TOKEN
    generate: hex
    bytes: 32
  - key: LOBBY_ADMIN_PASSWORD
    generate: password
    length: 24
