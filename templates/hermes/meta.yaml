name: Hermes Agent
category: AI Agent
icon: zap
# Upstream's own mark, bundled locally under frontend/public/logos so the
# panel makes no third-party requests and still works offline.
logo: /logos/hermes.ico
color: "#3b82f6"
description: |
  NousResearch Hermes Agent — multi-tool AI agent with MCP support,
  dashboard interface, and extensive skill library. Deploy a powerful
  AI assistant with 26+ tools and 65+ skills.

instructions: |
  After deployment, the Hermes web app opens at the assigned domain and the
  admin dashboard at /admin on the same domain. Both use username "admin" and
  the configured password, and each asks for it once. Set your OpenAI API key
  to enable LLM functionality. A guest with HERMES_WEBAPP=false has the
  dashboard at the domain instead.

  To let agents outside the hotel call this one over A2A, set A2A_PORT=9900
  and A2A_PEER_TOKENS=<name>:<token> for each caller, then
  HERMES_A2A_PUBLIC=true, and redeploy. They call https://<domain>/a2a with
  their token as a Bearer header. Guests in the hotel need no public address:
  they call http://<container name>:9900.

