name: OpenClaw
category: AI Agent
icon: paw
# Upstream's own mark, bundled locally under frontend/public/logos so the
# panel makes no third-party requests and still works offline.
logo: /logos/openclaw.svg
color: "#10b981"
description: |
  OpenClaw is a persistent AI agent with gateway, tools and browser. 
  Deploy a fully autonomous AI assistant with multi-provider support,
  persistent memory, and browser automation capabilities.

instructions: |
  After deployment, access OpenClaw at the assigned domain. Configure your
  LLM provider API keys in the agent settings. The gateway token is 
  auto-generated and shown in the AgentHotel credentials section.

changeLog:
  - date: 2025-01-25
    description: Initial template with device auth disabled

links:
  - label: Website
    url: https://github.com/openclaw/openclaw
  - label: Documentation
    url: https://docs.openclaw.io

benefits:
  - title: Persistent Agent
    description: Long-running AI agent with memory and context persistence
  - title: Multi-Provider
    description: Support for OpenAI, Anthropic, OpenRouter, and custom providers
  - title: Browser Automation
    description: Built-in Chromium for web browsing and automation

features:
  - title: Gateway Mode
    description: Local gateway with REST API and WebSocket support
  - title: Device Pairing
    description: Connect multiple devices with automatic acceptance
  - title: Tool Integration
    description: File operations, web search, shell commands, and more
  - title: Memory Core
    description: Persistent conversation history and knowledge base

tags:
  - AI
  - Agent
  - Self-Hosted
  - Automation
  - LLM
